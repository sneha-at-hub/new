<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MLB Highlight Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="i-left" viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></symbol>
    <symbol id="i-right" viewBox="0 0 24 24"><path d="M9 6l6 6-6 6"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15a1 1 0 0 0 1.5.86l12-7.5a1 1 0 0 0 0-1.72l-12-7.5A1 1 0 0 0 7 4.5z"/></symbol>
    <symbol id="i-film" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l3 3 5-6"/></symbol>
    <symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7.5v5.5M12 16.5v.01"/></symbol>
    <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-7 9 7M5 10v10h14V10"/></symbol>
    <symbol id="i-plane" viewBox="0 0 24 24"><path d="M10 14L3 11l1.5-2 8 .5L16 5l2.5 1-2 5 4 2.5-.5 2-5-.5-3 5-2-.5z"/></symbol>
    <symbol id="i-ball" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M5.5 5.5c2.5 2 2.5 11 0 13M18.5 5.5c-2.5 2-2.5 11 0 13"/></symbol>
</svg>

<div class="app">
    <div class="bar">
        <div class="brand"><svg class="i"><use href="#i-ball"/></svg>MLB Highlight Finder</div>
        <p>Pick a year, month and day.</p>
    </div>

    <section class="hero finder">
        <div class="hero-label">Game date</div>
        <div class="date-row">
            <div class="pick">
                <label for="yearSelect">Year</label>
                <div class="select-wrap"><select id="yearSelect"></select></div>
            </div>
            <span class="slash" aria-hidden="true">/</span>
            <div class="pick">
                <label for="monthSelect">Month</label>
                <div class="select-wrap"><select id="monthSelect"></select></div>
            </div>
            <span class="slash" aria-hidden="true">/</span>
            <div class="pick">
                <label for="daySelect">Day</label>
                <div class="select-wrap"><select id="daySelect"></select></div>
            </div>
        </div>
        <div class="date-meta">
            <div id="dateFeedback" role="status"></div>
            <button class="btn primary" id="retrieveButton" type="button">Retrieve MLB Data for this Date<svg class="i"><use href="#i-arrow"/></svg></button>
        </div>
        <div id="statusMessage" role="status"></div>
    </section>

    <section class="game" aria-label="Game">
        <div class="matchup">
            <div class="role"><svg class="i"><use href="#i-plane"/></svg>Away Team Name</div>
            <div class="display-box" id="awayTeam"></div>
            <div class="role"><svg class="i"><use href="#i-home"/></svg>Home Team Name</div>
            <div class="display-box" id="homeTeam"></div>
        </div>
        <div class="game-foot">
            <span class="count" id="gameCount"></span>
            <div class="pair">
                <button class="btn" id="prevGameButton" type="button"><svg class="i"><use href="#i-left"/></svg>Previous Game for this Date</button>
                <button class="btn" id="nextGameButton" type="button">Next Game for this Date<svg class="i"><use href="#i-right"/></svg></button>
            </div>
        </div>
    </section>

    <section class="reel" aria-label="Highlights">
        <h2><svg class="i"><use href="#i-film"/></svg>Highlight Playbacks</h2>
        <div class="reel-name" id="highlightName"></div>
        <div class="progress" id="progress" aria-hidden="true"></div>
        <div class="controls">
            <button class="btn play" id="playButton" type="button"><span class="disc"><svg class="i"><use href="#i-play"/></svg></span>Run Playback for this Highlight</button>
            <button class="btn" id="prevHighlightButton" type="button"><svg class="i"><use href="#i-left"/></svg>Previous Highlight for this Date</button>
            <button class="btn" id="nextHighlightButton" type="button">Next Highlight for this Date<svg class="i"><use href="#i-right"/></svg></button>
            <span class="count" id="highlightCount"></span>
        </div>
    </section>
</div>

<script src="script.js"></script>
</body>
</html>
